# AUTOSTART
exec_once=swaybg -i /home/leo/Immagini/road.jpg
exec_once=waybar &
exec_once=swayosd-server -s ~/.config/swayosd/style.css
exec_once=wayland-pipewire-idle-inhibit &
exec_once=swayidle -w timeout 300 "mmsg dispatch sleep_monitor,eDP-1" resume "mmsg dispatch wakeup_monitor,eDP-1" timeout 600 "systemctl suspend" &

# ENVIRONMENT
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 0
xkb_rules_layout=it
var=term,kitty
var=explorer,kitty yazi
var=browser,helium-browser
var=editor,nvim
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct
cursor_theme="catppuccin-macchiato-dark-cursors"

# VISUAL
enable_floating_snap = 1
# window_rule=is_floating:1,is_overlay:1,app_id:helium-browser,title:Picture_in_Picture
blur = 1
blur_optimized = 1

# cursor_theme=catppuccin-macchiato-dark

animations=1
animation_type_open=zoom
animation_type_close=zoom


shadows = 1
shadow_only_floating = 0
layer_shadows = 1
shadows_size = 7
shadows_blur = 15
shadows_color = 0x000000ff
shadows_position_x = 0
shadows_position_y = 0

border_px = 2
border_radius = 9
focus_color=0x7097B7FF
border_color=0x363749FF
focused_opacity = 1.0
unfocused_opacity = 0.9


# KEYBINDS
new_is_master=0
bind=SUPER,m,setlayout,dwindle


bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%
bind=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume +5
bind=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume -5

bind=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness +5
bind=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness -5

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_right,killclient


bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,TAB,view,0

bind=Super,Space,spawn,rofi -show run
bind=Super,T,spawn,$term
bind=Super,Q,killclient
bind=Super,F,togglefullscreen
bind=Super,P,spawn,hyprpicker -a
bind=Super,L,spawn,wlsunset -T 3801 -t 3800
bind=Alt,L,spawn,pkill wlsunset
bind=SUPER,E,spawn,$explorer  
bind=SUPER,H,spawn,$browser

gesturebind=none,right,3,viewprev_have_client
gesturebind=none,left,3,viewnext_have_client


